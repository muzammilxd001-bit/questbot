name: Deploy to Railway

on:
    push:
        branches:
            - main
    workflow_dispatch: {}

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Trigger Railway deployment
              env:
                  RAILWAY_DEPLOY_HOOK_URL: ${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}
              run: |
                  if [ -z "$RAILWAY_DEPLOY_HOOK_URL" ]; then
                    echo "RAILWAY_DEPLOY_HOOK_URL is not configured; skipping deploy."
                    echo "Add the Railway deploy hook URL as a GitHub Actions secret to enable this workflow."
                    exit 0
                  fi

                  curl --fail-with-body --silent --show-error \
                    --request POST \
                    --url "$RAILWAY_DEPLOY_HOOK_URL"
                  echo "Railway deployment triggered successfully."